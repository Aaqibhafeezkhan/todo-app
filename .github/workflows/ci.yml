name: CI Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      # The deploy job picks this up (see .github/workflows/deploy.yml)
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            build/
            scripts/deploy.sh
