name: PR Security Check

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  actions: read
  contents: write
  pull-requests: write
  issues: write

jobs:
  security-scan:
    runs-on: [self-hosted, linux, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          allow-unsafe-pr-checkout: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # npm ci gets killed on the small arm64 runner, so unpack the node_modules that CI Build
      # uploads from main and only install when there is nothing to unpack
      - name: Find the latest main build
        id: main-build
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              branch: 'main',
              event: 'push',
              status: 'success',
              per_page: 1,
            });
            core.setOutput('run_id', runs.data.workflow_runs[0]?.id ?? '');

      - name: Download node_modules from the main build
        if: steps.main-build.outputs.run_id != ''
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: node-modules
          run-id: ${{ steps.main-build.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install and Test
        run: |
          if [ -f node_modules.tar.gz ]; then
            tar -xzf node_modules.tar.gz && rm node_modules.tar.gz
          else
            NODE_OPTIONS=--max-old-space-size=512 npm ci --no-audit --no-fund
          fi
          npm run lint --if-present
          npm test -- --watchAll=false --maxWorkers=2
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}

      - name: Comment test summary
        if: always()
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            -d "{\"body\":\"Security check finished with status: ${{ job.status }} (${{ github.event.pull_request.title }})\"}" > /dev/null
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
