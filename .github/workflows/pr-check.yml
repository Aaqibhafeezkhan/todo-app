name: PR Security Check

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  security-scan:
    runs-on: [self-hosted, linux, arm64]
    env:
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          allow-unsafe-pr-checkout: true

      # The deploy config is spread over four files and a PR that drops a key only fails hours later in
      # the staging deploy, so check it on the branch first (key names only, see scripts/check_config.py).
      - name: Config check
        run: python3 scripts/check_config.py staging

      # npm ci and jest do not fit in the runner's memory (the last two PR runs were OOM-killed and
      # took the runner offline), so the runner only scans the change. Unit tests run in CI Build.
      - name: Credential scan
        run: |
          chmod +x ./scripts/security-scan.sh
          ./scripts/security-scan.sh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

      - name: Comment test summary
        if: always()
        # A failed comment (deleted PR, API hiccup) should not turn the check red, so no -f here.
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            -d "{\"body\":\"Security check finished with status: ${{ job.status }} (${{ github.event.pull_request.title }})\"}" > /dev/null
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
